# CI/CD — 全棧自動構建 + 測試 + 安全掃描
# 觸發: push to main/master, PR to main/master
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ===== 密鑰洩露掃描 =====
  security-scan:
    name: Security Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整歷史才能掃描所有 commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_CONFIG: .github/gitleaks.toml

  # ===== Agent 服務：Lint + 測試 =====
  agent-lint:
    name: Agent Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff>=0.5.0,<0.10.0

      - name: Run ruff check
        run: ruff check app/ tests/

      - name: Run ruff format check
        run: ruff format --check app/ tests/

  agent-test:
    name: Agent Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          DEVIN_API_KEY: "ci-test-key"
          QODER_PERSONAL_ACCESS_TOKEN: "ci-test-token"
          LOG_LEVEL: "WARNING"

  # ===== Java 後端：編譯 + 測試 =====
  java-build:
    name: Java Build + Test (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compile
        run: mvn -B -DskipTests compile

      - name: Run tests (if any)
        run: mvn -B test
        continue-on-error: true  # 測試待補，先不阻塞 CI

  # ===== Next.js 前端：Lint + 類型檢查 + 構建 =====
  next-build:
    name: Next.js Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: ESLint
        run: npx eslint src/
        continue-on-error: true  # 部分警告待修，先不阻塞 CI

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_HOST: "http://localhost:8090"

  # ===== Docker 構建驗證 =====
  docker-build:
    name: Docker Build (Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Agent Docker image
        run: docker build -t tw-agent-ci ./agent
