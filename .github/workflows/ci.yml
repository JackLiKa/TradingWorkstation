# CI/CD — 全棧自動構建 + 測試
# 觸發: push to main/master, PR to main/master
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ===== Agent 服務測試 =====
  agent-test:
    name: Agent Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          DEVIN_API_KEY: "ci-test-key"
          QODER_PERSONAL_ACCESS_TOKEN: "ci-test-token"
          LOG_LEVEL: "WARNING"

  # ===== Java 後端構建 =====
  java-build:
    name: Java Build (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn -B -DskipTests compile

  # ===== Next.js 前端構建 =====
  next-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BACKEND_HOST: "http://localhost:8090"

  # ===== Docker 構建驗證 =====
  docker-build:
    name: Docker Build (Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Agent Docker image
        run: docker build -t tw-agent-ci ./agent
