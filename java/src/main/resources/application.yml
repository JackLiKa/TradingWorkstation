spring:
  application:
    name: trading-workstation
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:a_stock_baostock}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: QuantHikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
    show-sql: false
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/TradingWorkstation}

app:
  title: ${APP_TITLE:量化交易工作台}
  query-defaults:
    adjustflag: ${DEFAULT_ADJUSTFLAG:3}
    limit: ${DEFAULT_LIMIT:200}
    lookback-days: ${LOOKBACK_DAYS:180}
  cache:
    summary-ttl-seconds: ${CACHE_SUMMARY_TTL_SECONDS:60}
    metrics-ttl-seconds: ${CACHE_METRICS_TTL_SECONDS:30}
    stock-ttl-seconds: ${CACHE_STOCK_TTL_SECONDS:30}
    industry-ttl-seconds: ${CACHE_INDUSTRY_TTL_SECONDS:60}
    forecast-ttl-seconds: ${CACHE_FORECAST_TTL_SECONDS:120}
    rotation-ttl-seconds: ${CACHE_ROTATION_TTL_SECONDS:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3010}
  notification:
    enabled: ${NOTIFICATION_ENABLED:false}
    mail:
      enabled: ${MAIL_ENABLED:false}
      host: ${MAIL_HOST:smtp.qq.com}
      port: ${MAIL_PORT:465}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
      to: ${MAIL_TO:}
    webhook:
      enabled: ${WEBHOOK_ENABLED:false}
      url: ${WEBHOOK_URL:}
      secret: ${WEBHOOK_SECRET:}
    alert-scheduler:
      enabled: ${ALERT_SCHEDULER_ENABLED:false}
      threshold: ${ALERT_SCHEDULER_THRESHOLD:15.0}
      cron: ${ALERT_SCHEDULER_CRON:0 30 15 * * MON-FRI}
  sync:
    python-executable: ${SYNC_PYTHON_EXECUTABLE:python}
    ingestion-script: ${SYNC_INGESTION_SCRIPT:ingestion/baostock_ingest.py}
    batch-size: ${SYNC_BATCH_SIZE:1000}
    default-start-date: ${SYNC_DEFAULT_START_DATE:2021-01-01}
  preference:
    path: ${PREFERENCE_PATH:preference.json}
  aicalllog:
    retention-days: ${AICALLLOG_RETENTION_DAYS:90}
    cleanup:
      enabled: ${AICALLLOG_CLEANUP_ENABLED:false}
      cron: ${AICALLLOG_CLEANUP_CRON:0 0 2 * * *}
  chart:
    batch-size: ${CHART_BATCH_SIZE:500}
  forecast:
    # 滾動窗口集成權重適應（避免 look-ahead bias）。默認關閉以保持與 Phase 4 固定權重行為一致。
    adaptive-weights: ${FORECAST_ADAPTIVE_WEIGHTS:false}
    # 滾動窗口天數（僅 adaptive-weights=true 時生效），默認 60 天
    rolling-window-days: ${FORECAST_ROLLING_WINDOW_DAYS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
